# ============================================
# AI教学平台 Docker Compose 配置
# 包含后端、数据库、MinIO、Redis
# ============================================

services:
  # PostgreSQL 数据库
  db:
    image: postgres:15-alpine
    container_name: ai-teaching-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-CHANGE_ME_DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-ai_teaching}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-teaching-network

  # MinIO 对象存储
  minio:
    image: minio/minio:RELEASE.2025-06-13T14-13-47Z
    container_name: ai-teaching-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-CHANGE_ME_MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-CHANGE_ME_MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - ai-teaching-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: ai-teaching-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASSWORD} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ai-teaching-network

  # 后端 API 服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-teaching-backend
    restart: unless-stopped
    environment:
      # 应用配置（生产环境必须关闭DEBUG）
      DEBUG: "false"
      APP_NAME: "AI Teaching Platform"
      APP_VERSION: "1.0.0"
      
      # 数据库配置
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-CHANGE_ME_DB_PASSWORD}@db:5432/${DB_NAME:-ai_teaching}
      DATABASE_POOL_SIZE: "20"
      DATABASE_MAX_OVERFLOW: "10"
      
      # JWT 配置（生产环境必须修改）
      SECRET_KEY: ${SECRET_KEY:-CHANGE_ME_SECRET_KEY_MIN_32_CHARS}
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      
      # MinIO 配置
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-CHANGE_ME_MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-CHANGE_ME_MINIO_SECRET_KEY}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-ai-teaching}
      MINIO_SECURE: "false"
      MINIO_REGION: "us-east-1"
      
      # Redis 配置
      REDIS_URL: redis://:${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASSWORD}@redis:6379/0
      
      # 日志配置
      LOG_LEVEL: "INFO"
      
      # Workers 配置
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      
      # CORS 配置
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai-teaching-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 数据库迁移服务（一次性）
  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-teaching-migration
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-CHANGE_ME_DB_PASSWORD}@db:5432/${DB_NAME:-ai_teaching}
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ai-teaching-network
    profiles:
      - migration

  # 前端服务（Nginx 托管 SPA + API 反向代理）
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-teaching-frontend
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ai-teaching-network

# 数据卷
volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local

# 网络
networks:
  ai-teaching-network:
    driver: bridge
